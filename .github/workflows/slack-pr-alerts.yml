name: slack-pr-alerts

on:
  pull_request:
    # 부모 글은 `opened` 에서만 만든다. draft 로 열린 PR 도 `opened` 를 받으므로 그때 하나가
    # 생기고, `ready_for_review` 와 `reopened` 는 이미 있는 부모 위에 하나를 더 만들 뿐이었다.
    # 스레드가 둘로 갈리면 코멘트는 find_ts 가 고른 쪽에만 달리고, 종료 리액션도 거기만
    # 붙어서 나머지 한 글이 열린 PR 인 채로 채널에 남는다.
    #
    # 조회해서 "이미 있으면 건너뛴다" 로 막지 않는다. 조회가 실패하면 없는 것과 구별되지
    # 않아 결국 하나 더 만들고, `opened` 실행과 `ready_for_review` 실행이 겹치면 둘 다
    # 없다고 보고 둘 다 만든다. 만들 수 있는 자리를 하나로 줄이면 두 경우가 같이 사라진다.
    #
    # `reopened` 는 남는다. 평소에는 부모를 만들지 않고 닫힐 때 붙은 리액션만 되돌린다.
    # 빼 두면 다시 열린 PR 이 채널에서 영영 닫힌 것으로 보인다. 닫힘과 다시 열림이 어느
    # 순서로 도착하든 결과가 같도록, 이벤트가 말하는 상태가 아니라 지금 상태를 읽는다.
    types: [opened, reopened, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  # 놓친 종료를 하루 한 번 훑는다 (아래 reconcile 참고). 09:10 KST.
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

# `pull_request` 이벤트만 PR 단위로 묶는다. GitHub 은 같은 그룹의 실행 **순서**는 보장하지
# 않지만 **동시에 돌지 않는 것**은 보장한다. 필요한 것이 그쪽이다. 부모를 만들 수 있는 길이
# 둘(`opened`, 부모 없는 `reopened`)이라, 겹쳐 돌면 서로의 글을 못 보고 둘 다 만든다.
# 순서가 필요한 리액션 쪽은 순서 대신 현재 상태를 읽어서 해결한다. 아래 종료/재오픈 블록
# 참고.
#
# 코멘트·리뷰 이벤트는 각자 run_id 를 그룹으로 받아 빠진다. 한 PR 로 묶으면 코덱스가 인라인
# 코멘트를 여러 개 다는 순간 이벤트가 몰리는데, 대기열에 하나만 남아 중간 알림이 사라진다.
concurrency:
  group: >-
    slack-pr-alerts-${{ github.event_name == 'pull_request'
      && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    # issue_comment 는 일반 이슈에도 뜨므로 PR 인 것만. 자기 자신이 만든 이벤트는 무시.
    # schedule / workflow_dispatch 는 sender 가 없어 두 조건 모두 통과한다.
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
      && github.event.sender.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          API=https://slack.com/api
          AUTH="Authorization: Bearer $SLACK_BOT_TOKEN"
          JSON="Content-type: application/json; charset=utf-8"

          # 코멘트 본문은 GitHub 표현식 보간으로 절대 끼워넣지 않는다 (스크립트 인젝션).
          # 언제나 $GITHUB_EVENT_PATH 를 jq 로 읽는다.
          EV="$GITHUB_EVENT_PATH"

          slack() { # slack <method> <json-payload>
            curl -sS -X POST -H "$AUTH" -H "$JSON" --data "$2" "$API/$1"
          }

          # ── 채널 히스토리에서 이 PR 의 부모 메시지 ts 찾기 ──────────────
          find_ts() {
            local cursor="" resp ts
            for _ in 1 2 3 4 5; do
              resp=$(curl -sS -H "$AUTH" -G "$API/conversations.history" \
                       --data-urlencode "channel=$SLACK_CHANNEL_ID" \
                       --data-urlencode "limit=200" \
                       ${cursor:+--data-urlencode "cursor=$cursor"})
              if [ "$(jq -r '.ok' <<<"$resp")" != "true" ]; then
                echo "conversations.history 실패: $(jq -r '.error' <<<"$resp")" >&2
                return 1
              fi
              ts=$(jq -r --arg m "$MARKER" \
                     'first(.messages[] | select((.text // "") | contains($m)) | .ts) // empty' <<<"$resp")
              [ -n "$ts" ] && { echo "$ts"; return 0; }
              cursor=$(jq -r '.response_metadata.next_cursor // ""' <<<"$resp")
              [ -z "$cursor" ] && break
            done
            return 0   # 못 찾음 = 빈 문자열
          }

          react() { # react <add|remove> <emoji> <ts>
            local r
            r=$(slack "reactions.$1" "$(jq -n --arg c "$SLACK_CHANNEL_ID" --arg n "$2" --arg t "$3" \
                  '{channel:$c, name:$n, timestamp:$t}')")
            # already_reacted / no_reaction 은 정상 흐름이므로 무시
            case "$(jq -r '.error // ""' <<<"$r")" in
              ""|already_reacted|no_reaction) ;;
              *) echo "reactions.$1 $2: $(jq -r '.error' <<<"$r")" >&2 ;;
            esac
          }

          # 종료 표시는 **둘 다 지우고** 하나를 단다. 한쪽만 지우면 ✗ 와 ✅ 가 같이 남는
          # 글이 생긴다: 머지 없이 닫혀 ✗ 가 붙은 PR 이 다시 열리고, 재오픈 실행이 상태를
          # 읽기 전에 머지되면 그 실행은 `merged=true` 를 보고 ✅ 만 더한다. 게다가 보정은
          # 닫힌 글을 `loading` 이 있을 때만 손보므로, 모순된 두 표시가 영구히 남는다.
          close_react() { # close_react <ts> <merged: true|false>
            react remove loading "$1"
            react remove hourglass_flowing_sand "$1"   # 구버전 잔재 정리
            if [ "$2" = "true" ]; then
              react remove x "$1"
              react add white_check_mark "$1"
            else
              react remove white_check_mark "$1"
              react add x "$1"
            fi
          }

          # 글 하나를 **지금** PR 상태에 맞춘다. 맞출 것이 없으면 아무것도 쓰지 않는다.
          # 표준출력으로 쓴 근거가 된 상태를 돌려주고, 로그는 표준오류로 보낸다.
          sync_one() { # sync_one <ts> <num> <marks>  ->  open|closed|""
            local ts="$1" num="$2" marks="$3" pr state merged
            pr=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$REPO/pulls/$num")
            state=$(jq -r '.state // ""' <<<"$pr")
            if [ "$state" = "closed" ]; then
              case ",$marks," in *,loading,*)
                merged=$(jq -r '.merged // false' <<<"$pr")
                close_react "$ts" "$merged"
                echo "보정: #$num 은 이미 닫혀 있어 이모지를 교체함 (merged=$merged)." >&2 ;;
              esac
            elif [ "$state" = "open" ]; then
              case ",$marks," in *,x,*|*,white_check_mark,*)
                react remove white_check_mark "$ts"
                react remove x "$ts"
                react add loading "$ts"
                echo "보정: #$num 은 열려 있어 종료 표시를 되돌림." >&2 ;;
              esac
            fi
            printf '%s' "$state"
          }

          # ── 놓친 종료 보정 ──────────────────────────────────────────────
          # 스택 PR 의 base 브랜치가 삭제되면 PR 은 닫히지만 GitHub 은
          # pull_request: closed 실행을 만들지 않는다. 그러면 loading 이 영영 남는다.
          # 그래서 채널에서 loading 이 붙은 이 레포의 글을 찾아 실제 PR 상태와 맞춘다.
          reconcile() { # reconcile [방금 처리해서 건너뛸 ts]
            local skip="${1:-}"
            local cursor="" resp rows ts num pr state merged
            local re="https://github\\.com/$REPO/pull/(?<n>[0-9]+)\\|"
            for _ in 1 2 3; do
              resp=$(curl -sS -H "$AUTH" -G "$API/conversations.history" \
                       --data-urlencode "channel=$SLACK_CHANNEL_ID" \
                       --data-urlencode "limit=200" \
                       ${cursor:+--data-urlencode "cursor=$cursor"})
              if [ "$(jq -r '.ok' <<<"$resp")" != "true" ]; then
                echo "보정: conversations.history 실패: $(jq -r '.error' <<<"$resp")" >&2
                return 0
              fi
              # 두 방향 모두 본다. 종료 이벤트를 놓친 글은 `loading` 을 달고 남고,
              # 닫혔다 다시 열린 PR 은 ✗ 나 ✅ 를 달고 남는다. 뒤엣것은 이벤트 두 개가
              # 겹칠 때 생기는데, 그 순서는 GitHub 이 보장하지 않으므로 코드로는 못 막는다.
              # 막는 대신 하루 한 번 현재 상태로 수렴시킨다.
              rows=$(jq -r --arg re "$re" '
                .messages[]
                | select((.reactions // []) | any(.name == "loading"
                                                  or .name == "x"
                                                  or .name == "white_check_mark"))
                | select((.text // "") | test($re))
                | "\(.ts) \((.text) | capture($re) | .n) \((.reactions // [])
                    | map(.name) | join(","))"' <<<"$resp")
              while read -r ts num marks; do
                [ -n "${ts:-}" ] || continue
                # 방금 종료 처리한 글은 히스토리가 아직 옛 리액션을 줄 수 있어 건너뛴다.
                [ "$ts" = "$skip" ] && continue
                # 이 스윕은 `github.run_id` 로 그룹을 잡고 이벤트 처리는 PR 번호로 잡으므로,
                # 둘은 같은 글에 **동시에** 쓸 수 있다. 읽고 쓰는 사이에 PR 이 닫히거나 다시
                # 열리면 낡은 값으로 마지막에 쓰는 쪽이 되어, 이벤트 쪽이 방금 맞춰 둔 표시를
                # 덮는다.
                #
                # 두 쪽을 한 그룹에 넣는 길은 없다. 그룹당 대기 슬롯은 하나라, 합치는 순간
                # 코멘트가 몰릴 때 뒤에 선 실행이 취소되고 Slack 글이 통째로 사라진다.
                # 알림을 잃는 쪽이 이모지가 잠깐 틀린 쪽보다 나쁘다.
                #
                # 그래서 쓰고 나서 다시 읽는다. 그 사이에 바뀌었으면 현재 상태로 한 번 더
                # 쓴다. 두 번째 패스의 `marks` 는 히스토리를 다시 받지 않고 방금 쓴 것에서
                # 계산한다. 히스토리는 어차피 더 낡아 있다.
                state=$(sync_one "$ts" "$num" "$marks")
                case "$state" in
                  closed) marks="x,white_check_mark" ;;
                  open)   marks="loading" ;;
                  *)
                    # `open` 도 `closed` 도 아니면 상태를 못 읽은 것이다. rate limit 이나
                    # 5xx 의 본문에는 `.state` 가 없어 빈 문자열이 되는데, 그걸 "열려 있음"
                    # 으로 읽으면 멀쩡히 닫힌 PR 들의 종료 표시를 한 바퀴 돌며 지운다.
                    echo "보정: #$num 의 상태를 읽지 못해 건너뜀." >&2
                    continue ;;
                esac
                again=$(sync_one "$ts" "$num" "$marks")
                [ "$again" = "$state" ] || \
                  echo "보정: #$num 이 처리 중에 $state 에서 ${again:-읽기 실패} 로 바뀌어 다시 맞춤." >&2
              done <<<"$rows"
              cursor=$(jq -r '.response_metadata.next_cursor // ""' <<<"$resp")
              [ -z "$cursor" ] && break
            done
          }

          # 스케줄/수동 실행은 보정만 하고 끝낸다.
          case "$EVENT_NAME" in
            schedule|workflow_dispatch) reconcile; exit 0 ;;
          esac

          # ── PR 식별자: 이벤트 종류마다 위치가 다르다 ────────────────────
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            PR_URL=$(jq -r '.issue.html_url'  "$EV")
            PR_NUM=$(jq -r '.issue.number'    "$EV")
          else
            PR_URL=$(jq -r '.pull_request.html_url' "$EV")
            PR_NUM=$(jq -r '.pull_request.number'   "$EV")
          fi
          # 부모 메시지에 "<URL|" 형태로 박히므로 이걸로 찾는다.
          # URL 만으로 찾으면 pull/1 이 pull/12 에 걸린다.
          MARKER="<$PR_URL|"

          # ── PR 종료/재오픈: 새 글 없이 부모 메시지의 이모지만 맞춘다 ────
          #
          # 이벤트가 말하는 상태가 아니라 **지금 상태**를 API 에 물어서 맞춘다. 닫힘과 다시
          # 열림이 몇 초 안에 겹치면 두 실행이 나란히 도는데, GitHub 은 같은 concurrency
          # 그룹의 실행 순서를 보장하지 않는다고 문서에 적어 두었다. 그래서 줄을 세워도
          # 늦게 도착한 `closed` 가 마지막에 ✗ 를 찍어 열린 PR 이 닫힌 것으로 남을 수 있다.
          # 둘 다 현재 상태를 읽고 쓰면 어느 쪽이 마지막이든 결과가 같다.
          ACTION=$(jq -r '.action' "$EV")
          if [ "$EVENT_NAME" = "pull_request" ] && \
             { [ "$ACTION" = "closed" ] || [ "$ACTION" = "reopened" ]; }; then
            TS=$(find_ts) && LOOKED=1 || LOOKED=0
            # 조회가 끝난 **뒤에** 상태를 읽는다. `find_ts` 는 요청을 다섯 번까지 하므로,
            # 그 앞에서 읽으면 그 사이에 다시 열린 PR 을 닫힌 것으로 알고 쓴다. 이렇게 해도
            # 원자적이지는 않다. 읽고 쓰는 사이는 여전히 열려 있고, GitHub 이 실행 순서를
            # 보장하지 않는 이상 코드로 닫을 수 있는 창이 아니다. 남는 어긋남은 위의
            # `reconcile` 이 하루 한 번 현재 상태로 되돌린다.
            NOW=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.state + " " + (.merged|tostring)')
            if [ "$LOOKED" = 0 ]; then
              # 조회 자체가 실패했다. 없는 것과 구별되지 않으므로 아무것도 하지 않고 끝낸다.
              # 여기서 빠져나가지 않으면 아래 부모 생성으로 흘러가서, 막으려던 중복을
              # 조회 실패 한 번으로 만들어 낸다.
              echo "부모 메시지를 조회하지 못함 (#$PR_NUM). 리액션 생략." >&2
              exit 0
            elif [ -z "$TS" ]; then
              # 확실히 없다. 다시 열린 PR 이라면 새 부모를 만든다. 그러지 않으면 ✗ 를 단
              # 옛 글만 남아 영영 닫힌 것으로 보이고, 하루 한 번 도는 보정은 `loading` 이
              # 달린 글만 고르므로 그 상태를 되돌리지 못한다.
              if [ "${NOW%% *}" = "open" ]; then
                echo "부모 메시지가 없어 다시 만든다 (#$PR_NUM)." >&2
              else
                echo "부모 메시지를 못 찾음 (#$PR_NUM). 리액션 생략." >&2
                reconcile ""
                exit 0
              fi
            elif [ "${NOW%% *}" = "open" ]; then
              react remove white_check_mark "$TS"
              react remove x "$TS"
              react add loading "$TS"
              exit 0
            else
              close_react "$TS" "${NOW##* }"
              # 이 PR 을 base 로 삼던 스택 PR 이 같이 닫혔을 수 있다.
              reconcile "$TS"
              exit 0
            fi
          fi

          # ── 메시지 본문 만들기 ──────────────────────────────────────────
          MSG=$(jq -n --arg event "$EVENT_NAME" --arg repo "$REPO" \
                      --slurpfile e "$EV" '
            # Slack mrkdwn 에서 `<...>` 는 문법이다. `<!channel>` 은 워크스페이스 전체
            # 호출이고 `<@U…>` 는 개인 호출이라, PR 제목이나 코멘트 본문에 적어 넣으면
            # 그대로 실행된다. 이 워크플로는 공개 저장소에서 아무나 남길 수 있는 글을 Slack
            # 시크릿을 들고 전달하므로, 남이 쓴 문자열은 전부 여기를 먼저 통과한다.
            # `&` 를 맨 먼저 바꿔야 한다. 나중에 하면 `&lt;` 가 `&amp;lt;` 가 된다.
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");

            # GitHub 마크다운 → Slack mrkdwn. 봇 코멘트의 배지/HTML 이 그대로 노출되는 걸 막는다.
            # 이스케이프가 먼저다. 그래서 아래에서 HTML 을 걷어낼 때 찾는 것도 `<` 가 아니라
            # `&lt;` 다. 마크다운 링크에서 만들어 내는 `<url|글자>` 는 이 뒤에 생기므로 살아남는다.
            def md2slack:
                esc
              | gsub("(?s)&lt;!--.*?--&gt;"; "")
              | gsub("!\\[(?<a>[^\\]]*)\\]\\([^)]*\\)";
                  (if (.a | length) > 0
                   then "[" + (.a | sub("\\s*(Badge|badge)\\s*$"; "")) + "]"
                   else "" end))
              # 속성까지 삼키되 첫 `&gt;` 에서 멈춘다. `[^&]*` 로 막으면 `&` 가 든 속성이
              # 있을 때, 이를테면 `?a=1&b=2` 같은 흔한 주소에서 여는 태그만 살아남아 화면에
              # 그대로 노출된다. 이스케이프를 먼저 하기 때문에 `&` 는 `&amp;` 로 바뀌어 있다.
              | gsub("&lt;/?[a-zA-Z][a-zA-Z0-9]*(\\s.*?)?&gt;"; "")
              # 링크는 http(s) 로만 만든다. `<...|...>` 는 Slack 문법이라, 목적지를 검사하지
              # 않으면 `[ping](!channel)` 이 `<!channel|ping>` 이 되어 이스케이프를 통과한
              # 뒤에 전체 호출이 다시 살아난다. `esc` 는 `<`, `>`, `&` 만 보므로 `!channel`
              # 이라는 글자에는 손대지 않는다. 그 외 목적지는 링크로 만들지 않고 글자로 남긴다.
              | gsub("\\[(?<t>[^\\]]*)\\]\\((?<u>[^)\\s]+)\\)";
                  (if (.u | test("^https?://")) then "<\(.u)|\(.t)>"
                   else "\(.t) (\(.u))" end))
              | gsub("\\*\\*"; "*")
              | gsub("(?m)^\\s{0,3}#{1,6}\\s+(?<h>.*)$"; "*\(.h)*")
              | gsub("(?m)^\\s*[-*_]{3,}\\s*$"; "")
              | gsub("\n{3,}"; "\n\n")
              | sub("^\\s+"; "") | sub("\\s+$"; "");
            ($e[0]) as $p
            | (if $event == "pull_request" then
                 # 여기로 오는 `pull_request` 는 `opened`, 그리고 부모 글이 사라져
                 # 다시 만들어야 하는 `reopened` 둘이다. 둘을 같은 말로 적으면 재오픈된
                 # PR 이 방금 생긴 것으로 보인다.
                 { icon: (if $p.action == "reopened" then "🔄" else "🆕" end),
                   kind: (if $p.action == "reopened" then "PR 재오픈" else "PR 생성" end),
                   t: $p.pull_request.title,
                   url: $p.pull_request.html_url, who: $p.sender.login,
                   body: (($p.pull_request.body // "") | md2slack), num: $p.pull_request.number }
               elif $event == "pull_request_review" then
                 { icon: (if $p.review.state == "approved" then "✅"
                          elif $p.review.state == "changes_requested" then "🛠" else "💬" end),
                   kind: (if $p.review.state == "approved" then "리뷰 승인"
                          elif $p.review.state == "changes_requested" then "변경 요청"
                          else "리뷰 제출" end),
                   t: $p.pull_request.title, url: $p.review.html_url,
                   who: $p.review.user.login, body: (($p.review.body // "") | md2slack),
                   num: $p.pull_request.number }
               elif $event == "pull_request_review_comment" then
                 { icon: "💬", kind: "코드 코멘트", t: $p.pull_request.title,
                   url: $p.comment.html_url, who: $p.comment.user.login,
                   body: ("`" + (($p.comment.path // "?") | esc) + "`\n"
                          + (($p.comment.body // "") | md2slack)),
                   num: $p.pull_request.number }
               else
                 { icon: "💬", kind: "PR 코멘트", t: $p.issue.title,
                   url: $p.comment.html_url, who: $p.comment.user.login,
                   body: (($p.comment.body // "") | md2slack), num: $p.issue.number }
               end) as $m
            # 부모 글의 fallback text 도 여기서 만든다. 아래에서 따로 조립하면 `esc` 를
            # 한 번 더 정의해야 하고, 그러면 이스케이프 규칙이 두 곳에 산다. 한쪽만 고치는
            # 날이 온다. `<\($m.url)|` 는 나중에 `find_ts` 가 이 글을 찾는 표지이므로
            # 형태를 바꾸면 안 된다.
            | { m: $m,
                fallback: "\($m.icon) \($m.kind) · \($repo)#\($m.num) <\($m.url)|#\($m.num) \($m.t | esc)>",
                blocks: ([ { type: "section", text: { type: "mrkdwn",
                  text: "\($m.icon) *\($m.kind)* · `\($repo)`\n<\($m.url)|#\($m.num) \($m.t | esc)>\nby *\($m.who | esc)*" } } ]
                + (if ($m.body | length) > 0
                   then [{ type: "section", text: { type: "mrkdwn", text: ($m.body[0:600]) } }]
                   else [] end)) }
          ')
          BLOCKS=$(jq -c '.blocks' <<<"$MSG")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # 여기로 오는 길은 둘이다. `opened`, 그리고 부모가 없는 것으로 확인된
            # `reopened`. 열자마자 닫고 다시 열면 `opened` 실행이 아직 글을 올리기 전일 수
            # 있고, 그러면 재오픈 쪽은 없다고 보고 만들고 `opened` 쪽은 무조건 만들어 둘이
            # 된다. 위의 concurrency 가 두 실행을 겹치지 않게 하고, 여기서 한 번 더 확인해서
            # 나중에 도는 쪽이 이미 있는 부모를 보게 한다.
            #
            # 조회가 실패하면 만든다. `opened` 에서 침묵하는 것이 중복보다 나쁘다. 첫 글이
            # 없으면 그 PR 의 코멘트는 전부 스레드 밖으로 흩어진다.
            if EXISTING=$(find_ts) && [ -n "$EXISTING" ]; then
              echo "부모 글이 이미 있다 (#$PR_NUM). 새로 만들지 않는다."
              exit 0
            fi
            FALLBACK=$(jq -r '.fallback' <<<"$MSG")
            RESP=$(slack chat.postMessage "$(jq -n --arg c "$SLACK_CHANNEL_ID" --arg t "$FALLBACK" \
                     --argjson b "$BLOCKS" '{channel:$c, text:$t, blocks:$b, unfurl_links:false}')")
            [ "$(jq -r '.ok' <<<"$RESP")" = "true" ] || { echo "$RESP" >&2; exit 1; }
            PTS=$(jq -r '.ts' <<<"$RESP")
            react add loading "$PTS"
            # 올린 **뒤에** 지금 상태를 읽는다. 열자마자 닫으면 두 실행이 생기고, 둘의
            # 순서는 GitHub 이 보장하지 않는다. `closed` 쪽이 먼저 돌면 부모가 없어 그냥
            # 끝나고, 뒤늦게 도는 이쪽이 닫힌 PR 을 열린 것으로 그려 놓는다.
            #
            # 읽기가 실패하면 `loading` 인 채로 둔다. 그 상태는 보정이 하루 한 번 집어
            # 가지만, 틀린 종료 표시는 보정이 건드리지 않아 그대로 굳는다.
            NOW=$(gh api "repos/$REPO/pulls/$PR_NUM" \
                    --jq '.state + " " + (.merged|tostring)' 2>/dev/null) || NOW=""
            case "$NOW" in
              closed*) close_react "$PTS" "${NOW##* }" ;;
            esac
            exit 0
          fi

          # ── 코멘트/리뷰: 부모 글 스레드에 답글 ───────────────────────────
          TS=$(find_ts)
          FALLBACK=$(jq -r --arg r "$REPO" '"\(.m.icon) \(.m.kind) · \($r)#\(.m.num)"' <<<"$MSG")
          PAYLOAD=$(jq -n --arg c "$SLACK_CHANNEL_ID" --arg t "$FALLBACK" --arg ts "$TS" \
                      --argjson b "$BLOCKS" '
            {channel:$c, text:$t, blocks:$b, unfurl_links:false}
            + (if $ts == "" then {} else {thread_ts:$ts} end)')
          RESP=$(slack chat.postMessage "$PAYLOAD")
          [ "$(jq -r '.ok' <<<"$RESP")" = "true" ] || { echo "$RESP" >&2; exit 1; }
          [ -n "$TS" ] || echo "부모 글을 못 찾아 최상위로 게시함 (#$PR_NUM)." >&2
