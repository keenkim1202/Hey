name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Pinned. Ruff adds rules to existing groups between releases, so an unpinned
      # install turns a branch red on a day nobody touched it, and the failure names a
      # line that has not changed in months. Raising this is a commit of its own.
      - run: pip install ruff==0.16.5

      # The selection lives in ruff.toml, so `ruff check` here and `ruff check` on a
      # laptop answer the same question.
      - run: ruff check

  selftest:
    name: selftest (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 on Linux pins the floor the README claims. The current release runs on both
        # platforms, which is also what proves the scripts are not macOS-only.
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: python and git versions
        run: |
          python3 --version
          git --version

      - name: selftest (en)
        run: python3 plugins/hey/scripts/selftest.py

      - name: selftest (ko)
        run: python3 plugins/hey/scripts/selftest.py --lang ko
