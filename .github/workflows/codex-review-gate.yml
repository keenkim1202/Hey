name: codex-review-gate

# 코덱스 리뷰가 끝났고 미해결 코멘트가 없을 때만 PR 머지를 연다.
#
# 상태는 셋이다:
#   failure  미해결 스레드가 있다. resolve 해라.
#   pending  코덱스가 이 head SHA 를 아직 리뷰하지 않았다. 기다려라.
#   success  이 head SHA 를 리뷰했고 미해결이 없다.
#
# "리뷰했다" 의 증거로 세는 것은 둘이다. 둘 다 본문에 `Reviewed commit: <10자 SHA>` 를
# 싣고 있어서, 어느 커밋을 본 것인지가 글에 적혀 있다.
#   1. 지적이 있으면  review 객체
#   2. 없으면        평범한 이슈 코멘트
#
# 1 만 보던 시절에는 2 로 끝난 PR 이 영영 pending 이었다. **깨끗한 PR 일수록 막히는**
# 방향으로 틀렸고, 그래서 2 를 같이 본다.
#
# 세 번째 모양이 있다. 코덱스가 자동으로 돈 리뷰에서 지적이 없으면 글을 하나도 남기지 않고
# PR 본문에 👍 만 누르고 끝낸다. **이건 증거로 쓰지 않는다.** 두 방향으로 다 고장 나기
# 때문이다:
#   - 리액션에는 무엇을 보고 눌렀는지가 적히지 않는다. 시각으로 이으려 해 봤지만, head 가
#     이 PR 의 것이 된 시각을 적어 두는 필드가 없다. 커밋 시각도 체크런 시각도 이미 다른
#     브랜치를 돈 커밋에서는 낡은 값이라, 옛 head 에 눌린 👍 가 새 head 를 통과시킨다.
#     **리뷰받지 않은 코드에 초록이 나가는 쪽**의 고장이다.
#   - 게다가 GitHub 은 한 사용자가 한 대상에 같은 리액션을 하나만 허용한다. 이미 +1 이
#     있으면 다시 눌러도 기존 것이 그대로 돌아온다. 그래서 코덱스가 head A 에 👍 를 남긴
#     뒤 head B 를 깨끗하게 봐도 시각을 갱신할 방법이 없다. 첫 head 이후로는 도움도 안 된다.
#
# 👍 로만 끝난 PR 은 `@codex review` 코멘트를 한 번 달면 된다. 불러서 답하게 하면 코덱스는
# 커밋 SHA 를 실은 코멘트로 답하고, 그건 추론 없이 읽을 수 있다.
#
# 신호는 잡의 성패가 아니라 **커밋 상태(commit status)** 다. 이유:
# 코멘트·리뷰 이벤트로 돈 실행은 GITHUB_SHA 가 PR 의 head 가 아니라서
# 잡이 만드는 체크런이 엉뚱한 커밋에 붙는다. 커밋 상태는 head SHA 에 직접 쏘고
# (sha, context) 로 덮어써지므로 마지막 결과만 남는다.
# 그래서 잡은 성패와 무관하게 항상 0 으로 끝난다.
#
# "Resolve conversation" 에는 트리거가 없다. pull_request_review_thread 는 Actions 이
# 받지 않는다. 스레드를 다 닫아도 상태는 낡은 채로 굳는데, 굳은 것을 풀어 줄 이벤트가
# 정의상 오지 않는다. 그래서 주기 스윕이 있다. 15 분마다 열린 PR 을 전부 다시 읽으므로
# 정체는 최대 한 주기다.
# 급하면 수동 실행이 여전히 가장 빠르다.
#   gh workflow run codex-review-gate.yml --repo keenkim1202/<레포> -f pr=<번호>
#
# 한계: issue_comment 와 schedule 은 pull_request 계열이 아니라서 **기본 브랜치의**
# 워크플로 파일이 돈다. 이 둘을 고치는 변경은 병합되기 전까지 그 PR 자신에게는 적용되지
# 않는다.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  # 지적이 없을 때 코덱스가 남기는 것은 리뷰가 아니라 이슈 코멘트다. 이 트리거가 없으면
  # 게이트를 다시 돌릴 이벤트가 아무것도 오지 않는다.
  issue_comment:
    types: [created]
  # "Resolve conversation" 은 어떤 트리거도 만들지 않는다. 그래서 스레드를 다 닫아도
  # failure 가 그대로 굳고, 풀어 줄 이벤트가 정의상 오지 않는다. 한 바퀴에 열린 PR 전부를
  # 다시 읽지만, 판정이 그대로면 아무것도 쓰지 않으므로 상태 이력은 조용하다.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 평가할 PR 번호
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  # 평가할 PR 을 고르기만 한다. 아무것도 쓰지 않으므로 겹쳐 돌아도 문제가 없고,
  # 직렬화는 아래 잡에서 PR 단위로 건다.
  list:
    runs-on: ubuntu-latest
    # issue_comment 는 PR 이 아닌 이슈에서도 온다. 그쪽은 볼 것이 없다.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_INPUT: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          # PR 번호는 아래에서 따옴표 없이 펼쳐야 여러 개가 갈라진다. 갈라지는 건 필요하고
          # 글롭은 필요 없으므로 글롭만 끈다. 검증이 걸러 주기는 하지만, 그건 이미 펼쳐진
          # 결과를 보는 것이고 여기서는 펼쳐지지 않게 하는 편이 짧다.
          set -f
          case "$GITHUB_EVENT_NAME" in
            schedule)
              # --paginate 가 없으면 한 페이지에서 끊긴다. 100 번째 뒤의 PR 은 스윕이
              # 존재를 모르므로, 이벤트 없는 신호로 굳은 상태가 영영 안 풀린다.
              # 열린 PR 이 256 개를 넘으면 이번에는 매트릭스 상한에 걸려 gate 잡이 아예
              # 시작되지 않는다. 자르는 쪽이 더 나쁘다고 보고 그냥 둔다. 그 규모가 되면
              # 스윕을 여러 잡으로 나눠야 한다.
              PRS=$(gh api --paginate "repos/$REPO/pulls" -X GET -f state=open \
                      -f per_page=100 --jq '.[].number') ;;
            workflow_dispatch)
              # 사람이 손으로 넣는 유일한 값이다. 숫자만 받는다.
              PRS="${PR_INPUT:-}"
              for x in $PRS; do
                case "$x" in
                  ''|*[!0-9]*) echo "PR 번호가 아니다: $x" >&2; exit 1 ;;
                esac
              done ;;
            *)
              PRS=$(jq -r '.pull_request.number // .issue.number // empty' \
                      "$GITHUB_EVENT_PATH") ;;
          esac

          if [ -z "$PRS" ]; then
            # 스윕이 도는데 열린 PR 이 없는 것은 정상이다. 나머지 경우는 부를 대상을
            # 못 찾은 것이라 조용히 끝내면 아무것도 안 한 실행이 성공으로 보인다.
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "열린 PR 없음"
              echo "prs=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "PR 번호를 못 찾았다. 수동 실행이라면 -f pr=<번호> 를 달아라." >&2
            exit 1
          fi

          echo "prs=$(jq -cn '$ARGS.positional' --args $PRS)" >> "$GITHUB_OUTPUT"

  gate:
    needs: list
    if: needs.list.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      # 한 PR 을 읽지 못했다고 나머지 PR 의 판정까지 버리지 않는다.
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.list.outputs.prs) }}
    # 직렬화의 단위는 PR 이고, 스윕도 같은 줄에 선다. 스윕만 따로 묶으면 스윕이 읽은 뒤
    # 이벤트 실행이 failure 를 쓰고, 그것을 못 본 스윕이 낡은 success 로 덮어 머지를
    # 잠깐 열어 준다. 매트릭스로 쪼개 두면 PR 번호가 그대로 그룹 이름이 되므로, 스윕과
    # 이벤트가 같은 PR 을 동시에 판정하는 일 자체가 없어진다.
    #
    # 취소가 아니라 대기다. 뒤에 선 잡은 앞 잡이 끝난 뒤에 조회를 시작하므로 마지막에
    # 쓰는 쪽이 언제나 가장 최근 조회다. 취소로도 순서는 잡히지만 취소된 잡이 체크 목록에
    # 실패로 남아, 판정과 무관한 빨강이 PR 마다 하나씩 생긴다.
    concurrency:
      group: codex-review-gate-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      - name: 코덱스 리뷰와 미해결 스레드 확인
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR_NUM: ${{ matrix.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          BOT=chatgpt-codex-connector   # GraphQL 의 author.login 에는 [bot] 이 안 붙는다
          BOT_Q="${BOT}[bot]"           # REST 와 reviews(author:) 는 [bot] 붙은 이름만 받는다
          CONTEXT=codex-review          # 필수 체크로 거는 이름. 바꾸면 브랜치 보호도 같이 고쳐야 한다
          NAME="${REPO#*/}"

          # head SHA 는 이벤트 페이로드가 아니라 API 에서 받는다. 수동 실행에는 페이로드가
          # 없고, 페이로드가 있어도 그 사이 푸시가 있었을 수 있다.
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.head.sha')
          SHORT="${HEAD_SHA:0:10}"      # 본문의 `Reviewed commit:` 은 10 자로 줄인 SHA 를 싣는다

          THREADS=$(gh api graphql -f query='
            query($owner:String!, $name:String!, $num:Int!, $bot:String!) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$num) {
                  # 코덱스 것만 서버에서 걸러 온다. 걸러 오지 않으면 이 100 칸은 사람과
                  # 봇의 리뷰가 나눠 쓰는 창이라, 코덱스 리뷰 뒤에 리뷰가 100 건 쌓인
                  # PR 에서는 이미 본 head 를 못 봤다고 답하게 된다.
                  reviews(last:100, author:$bot) {
                    nodes { author { login } commit { oid } body }
                  }
                  reviewThreads(first:100) {
                    nodes {
                      isResolved
                      isOutdated
                      path
                      comments(first:1) { nodes { author { login } url } }
                    }
                  }
                }
              }
            }' -F owner="$OWNER" -F name="$NAME" -F num="$PR_NUM" -F bot="$BOT_Q")

          # 코드가 바뀌어 outdated 가 된 스레드도 resolve 전까지는 미해결로 센다.
          # 고쳤으면 "Resolve conversation" 을 눌러 닫으라는 뜻이다.
          OPEN=$(jq -c --arg bot "$BOT" '
            [ .data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].author.login == $bot)
              | { path: (.path // "?"), url: .comments.nodes[0].url, outdated: .isOutdated } ]
          ' <<<"$THREADS")
          N=$(jq 'length' <<<"$OPEN")

          # 1. 지적이 있을 때 남는 리뷰. head SHA 에 달린 것만 센다. 옛 커밋에 달린 리뷰는
          #    그 뒤에 푸시된 코드를 본 적이 없으므로, 그것으로 초록을 주면 리뷰를 우회하는
          #    길이 된다. author 를 여기서 또 보는 이유는 위 필터가 언젠가 아무것도 거르지
          #    않게 됐을 때 사람 리뷰 하나로 초록이 켜지는 쪽으로 실패하지 않게 하려는 것이다.
          #    author 나 commit 이 null 이어도 jq 는 null 을 돌려주므로 그냥 안 맞는다.
          REVIEWS=$(jq --arg bot "$BOT" --arg sha "$HEAD_SHA" --arg short "$SHORT" '
            [ .data.repository.pullRequest.reviews.nodes[]
              | select(.author.login == $bot)
              | select(.commit.oid == $sha or ((.body // "") | contains($short))) ] | length
          ' <<<"$THREADS")

          # 2. 지적이 없을 때 남는 평범한 코멘트. 이쪽은 걸러 올 인자가 없어서 100 칸을
          #    사람과 나눠 쓰고, 코멘트가 하나 달릴 때마다 이 워크플로가 다시 도는 탓에
          #    깨끗한 결과가 창 밖으로 밀려나면 이미 본 head 를 못 봤다고 답하게 된다.
          #    그래서 GraphQL 대신 REST 를 `--paginate` 로 끝까지 읽는다.
          CLEAN=$(gh api --paginate "repos/$REPO/issues/$PR_NUM/comments" \
                    --jq "[.[] | select(.user.login == \"$BOT_Q\")
                              | select(.body | contains(\"Reviewed commit\")
                                            and contains(\"$SHORT\"))] | length" \
                  | jq -s 'add // 0')

          REVIEWED=$((REVIEWS + CLEAN))

          if [ "$N" -gt 0 ]; then
            STATE=failure
            DESC="코덱스 미해결 코멘트 ${N}건: resolve 후 다시 실행"
          elif [ "$REVIEWED" -eq 0 ]; then
            STATE=pending
            DESC="코덱스 리뷰 대기 중"
          else
            STATE=success
            DESC="코덱스 미해결 코멘트 없음"

            # 커밋 상태는 (저장소, SHA, context) 로 저장된다. PR 별이 아니다. 그래서 열린
            # PR 둘이 같은 head 를 가리키면 한쪽의 초록이 다른 쪽 자리를 덮어써서, 리뷰받지
            # 않은 PR 이 머지 가능해진다. context 에 PR 번호를 넣으면 필수 체크 이름이 PR
            # 마다 달라져 브랜치 보호가 걸 수 없으니, PR 별 게이트는 GitHub 의 상태 모델로는
            # 표현되지 않는다. 그래서 겹친 것을 발견하면 초록만 주지 않는다. 막는 쪽으로만
            # 틀리므로 이것 때문에 리뷰가 통과되는 일은 없다.
            #
            # 초록일 때만 묻는다. 다른 판정은 덮어써도 게이트가 열리지 않는다. 페이지네이션은
            # 필요 없다. 묻는 것이 "몇 개인가" 가 아니라 "하나보다 많은가" 뿐이라, 첫 페이지가
            # 30 개에서 끊겨도 답은 달라지지 않는다.
            SHARED=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                       --jq '[.[] | select(.state == "open")] | length')
            if [ "${SHARED:-1}" -gt 1 ]; then
              STATE=pending
              DESC="열린 PR ${SHARED}개가 같은 head 를 쓴다. 상태를 PR 별로 나눌 수 없다"
            fi
          fi

          # 판정이 그대로면 쓰지 않는다. 스윕이 15 분마다 같은 답을 다시 적으면 상태 이력이
          # 하루 백 줄씩 늘어나 정작 바뀐 순간을 못 찾게 된다.
          #
          # 읽는 곳은 combined status 다. context 마다 **가장 최근 것 하나**를 돌려주므로
          # 찾는 줄이 페이지 밖으로 밀려날 자리가 없다. 목록 엔드포인트는 모든 context 의
          # 이력을 시간 역순으로 30 개씩 끊어 주기 때문에, 다른 context 가 우리 것보다 새로
          # 30 개 쌓이면 못 찾고 지나친다. 그러면 매번 새로 쓰게 되고, SHA 와 context 당
          # 1000 개라는 상한을 향해 스윕이 하루 96 줄씩 밀어 올린다.
          PREV=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
                   --jq "[.statuses[] | select(.context == \"$CONTEXT\")][0]
                         | [.state, .description] | @tsv" 2>/dev/null || true)
          if [ "$PREV" = "$(printf '%s\t%s' "$STATE" "$DESC")" ]; then
            echo "PR #$PR_NUM: $STATE 그대로"
            exit 0
          fi

          {
            echo "## 코덱스 리뷰 게이트"
            echo
            echo "PR #$PR_NUM · \`${HEAD_SHA:0:7}\` · **$STATE** - $DESC"
            if [ "$STATE" = pending ]; then
              echo
              echo "이 커밋을 본 코덱스의 리뷰도 코멘트도 아직 없다. 도착하면 이 체크가"
              echo "갱신된다. 코덱스가 글 없이 👍 만 남긴 PR 이라면 그건 어느 커밋을 본"
              echo "것인지 적혀 있지 않아 증거로 세지 않으니, \`@codex review\` 를 한 번"
              echo "달아라. 부르면 커밋 SHA 를 실은 코멘트로 답한다."
            fi
            if [ "$N" -gt 0 ]; then
              echo
              jq -r '.[] | "- `\(.path)`\(if .outdated then " (outdated)" else "" end) - \(.url)"' <<<"$OPEN"
              echo
              echo "모두 resolve 한 뒤 다음 스윕까지 기다리기 싫으면 다시 돌려라."
              echo "\`gh workflow run codex-review-gate.yml --repo $REPO -f pr=$PR_NUM\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$DESC (PR #$PR_NUM, $HEAD_SHA)"
          [ "$N" -eq 0 ] || jq -r '.[] | "  \(.path) \(.url)"' <<<"$OPEN"

          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="$CONTEXT" \
            -f description="$DESC" \
            -f target_url="$RUN_URL" --silent

          # 잡 자체는 항상 성공으로 끝낸다. 판정은 위 커밋 상태에 있다.
